server:
  port: 8080
  servlet:
    context-path: /api
    
spring:
  application:
    name: be26
  datasource:
    url: jdbc:h2:mem:be26db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    # DB_CLOSE_DELAY=-1;
    # DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password: password
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: true

jwt:
  secret: 6f61d7eab8c04c5c93d8e6f7d4b0a1c2f3e4d5c6b7a8091f2e3d4c5b6a7f8e9
  expiration: 86400000  # 1 day in ms

logging:
  level:
    org.springframework: INFO

stripe:
  secret-key: sk_test_YourSecretKeyHere
  publishable-key: pk_test_YourPublishableKeyHere
  webhook-secret: whsec_YourWebhookSecretHere

security:
  ip-whitelist:
    enabled: true
    global-allow:
      - 127.0.0.1
      - ::1
    paths:
      /wallet/transfer:
        - 192.168.1.100
        - 10.0.0.0/8
      /admin/**:
        - 203.0.113.0/24
    default-deny: false
  geo-restriction:
    enabled: true
    default-allow: true
    blocked-countries:
      - RU
      - IR
      - KP
      - SY
    paths:
      /wallet/transfer:
        blocked-countries:
          - CN
          - IN
      /admin/**:
        allowed-countries:
          - US
          - CA
          - GB
    log-only: false