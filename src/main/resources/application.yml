server:
  port: ${APP_PORT:8080}
  servlet:
    context-path: ${APP_CONTEXT_PATH:/api}
    
spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: be26
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/be26db}
    driverClassName: ${DB_DRIVER:org.postgresql.Driver}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
  jpa:
    database-platform: ${DB_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
    hibernate:
      ddl-auto: update
    show-sql: false
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:your-email@gmail.com}
    password: ${MAIL_PASSWORD:your-app-password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:sk-test-key}
      model: ${OPENAI_MODEL:gpt-3.5-turbo}

jwt:
  secret: ${JWT_SECRET:6f61d7eab8c04c5c93d8e6f7d4b0a1c2f3e4d5c6b7a8091f2e3d4c5b6a7f8e9}
  expiration: ${JWT_EXPIRATION:86400000}  # 1 day in ms

logging:
  level:
    org.springframework: INFO

app:
  cors:
    allowed-origins:
      - http://localhost:3000

stripe:
  secret-key: sk_test_YourSecretKeyHere
  publishable-key: pk_test_YourPublishableKeyHere
  webhook-secret: whsec_YourWebhookSecretHere

paystack:
  secret-key: ${PAYSTACK_SECRET_KEY:sk_test_your_paystack_key}
  public-key: ${PAYSTACK_PUBLIC_KEY:pk_test_your_paystack_key}

flutterwave:
  secret-key: ${FLUTTERWAVE_SECRET_KEY:sk_test_your_flutterwave_key}
  public-key: ${FLUTTERWAVE_PUBLIC_KEY:pk_test_your_flutterwave_key}

payment:
  default-provider: ${PAYMENT_PROVIDER:paystack}

security:
  ip-whitelist:
    enabled: true
    global-allow:
      - 127.0.0.1
      - ::1
    paths:
      /wallet/transfer:
        - 192.168.1.100
        - 10.0.0.0/8
      /admin/**:
        - 203.0.113.0/24
    default-deny: false
  geo-restriction:
    enabled: true
    default-allow: true
    blocked-countries:
      - RU
      - IR
      - KP
      - SY
    paths:
      /wallet/transfer:
        blocked-countries:
          - CN
          - IN
      /admin/**:
        allowed-countries:
          - US
          - CA
          - GB
    log-only: false